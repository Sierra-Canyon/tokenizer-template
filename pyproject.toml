[project]
name = "swe-2627"
version = "0.1.0"
description = "Honors Software Engineering 2026-27 — student workspace"
requires-python = ">=3.12,<3.13"   # tiktoken has no 3.13 wheels; see A01
dependencies = [
    "tiktoken>=0.7",
    "regex>=2024.5.15",
    "numpy>=1.26",
    "pytest>=8.0",
    "jupyterlab>=4.0",
]

[tool.uv]
package = false          # this is a workspace, not a library to install

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
